<h1 class="title">{{ 'students-title' | translate }}</h1>
@if (store.loading()) { <mat-spinner/> }
@if (store.error()) { <mat-error>{{ store.error() | translate }}</mat-error> }
<table mat-table [dataSource]="dataSource()" matSort>
  <ng-container matColumnDef="id"><th mat-header-cell *matHeaderCellDef mat-sort-header>{{ 'common-id' | translate }}</th><td mat-cell *matCellDef="let category">{{ category.id }}</td></ng-container>
  <ng-container matColumnDef="fullName"><th mat-header-cell *matHeaderCellDef mat-sort-header>{{ 'students-full-name' | translate }}</th><td mat-cell *matCellDef="let category">{{ category.fullName }}</td></ng-container>
  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef>{{ 'common-actions' | translate }}</th>
    <td mat-cell *matCellDef="let category">
      <button mat-icon-button [attr.aria-label]="'students-edit-aria' | translate" (click)="editCategory(category.id)">
        <mat-icon>edit</mat-icon></button>
      <button mat-icon-button [attr.aria-label]="'students-delete-aria' | translate" (click)="deleteCategory(category.id)">
        <mat-icon>delete</mat-icon></button></td></ng-container>
  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr><tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
<mat-paginator [pageSize]="5" [pageSizeOptions]="[5, 10, 20]"/>
<button mat-raised-button (click)="navigateToNew()">{{ 'students-new' | translate }}</button>
