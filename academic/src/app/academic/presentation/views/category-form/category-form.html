<h1 class="title">{{ (isEdit ? 'students-edit' : 'students-new') | translate }}</h1>
<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-form-field><mat-label>{{ 'students-full-name' | translate }}</mat-label>
    <input matInput formControlName="name">
    @if (form.controls.name.hasError('required')) { <mat-error>{{ 'students-full-name-required' | translate }}</mat-error> }
  </mat-form-field>
  <button mat-raised-button type="submit" [disabled]="form.invalid">{{ (isEdit ? 'common-update' : 'common-create') | translate }}</button>
</form>
